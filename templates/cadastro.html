{% extends "base.html" %}

{% block title %}Cadastro{% endblock %}

{% block content %}
<h1>Cadastro</h1>
<p>Os dados enviados são gravados no banco MySQL da instância DB.</p>

<form class="formulario" method="post" action="{{ url_for('cadastro') }}">
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" maxlength="100" value="{{ dados.nome or '' }}" required>

    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" maxlength="150" value="{{ dados.email or '' }}" required>

    <label for="curso">Curso</label>
    <input type="text" id="curso" name="curso" maxlength="100" value="{{ dados.curso or '' }}" required>

    <label for="mensagem">Mensagem (opcional)</label>
    <textarea id="mensagem" name="mensagem" rows="4" maxlength="500">{{ dados.mensagem or '' }}</textarea>

    <button type="submit" class="botao">Cadastrar</button>
</form>
{% endblock %}
